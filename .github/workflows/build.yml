name: build

on:
  push:
    branches: [eoleun]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: sh -n service.sh && sh -n customize.sh

      - name: Zip module
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          tag="v${ver#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP=ksu_stabilizer-$tag.zip" >> "$GITHUB_ENV"
          zip -r "ksu_stabilizer-$tag.zip" module.prop service.sh customize.sh META-INF -x '*.DS_Store'

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Tag + release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
